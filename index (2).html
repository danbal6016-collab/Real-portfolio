<title>Jihyun Kim Portfolio</title>

<style id="css">
/* Layout: velvet-and-silk editorial. A living burgundy silk field and a fortune-teller's crystal orb open the page under one white line; then About (philosophy, formation, proof), How I think (pinned run), the Works archive by discipline (owner-editable), and a lacquered contact. Velvet black, wine, burgundy, blush, ivory. */
:root {
  --black: #0a0708;
  --velvet: #150a0d;
  --wine: #2b0c12;
  --burgundy: #7b1530;
  --rose: #c46b7c;
  --blush: #ead2cb;
  --ivory: #f4ede6;
  --dim: #a8999a;
  --line: rgba(244, 237, 230, .12);
  --f-display: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;

  color-scheme: dark;
}
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }
* { box-sizing: border-box; }

html { background: var(--black); }

a { color: inherit; text-decoration: none; }

::selection { background: var(--burgundy); color: var(--ivory); }
:focus-visible { outline: 1px solid var(--blush); outline-offset: 4px; }

@media (min-width: 900px) { .pad { padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(44px, env(safe-area-inset-right, 0px)); } }
.sc { font-family: var(--f-text); font-weight: 500; font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; }
.dim { color: var(--dim); }
.l { display: block; overflow: hidden; padding-bottom: .1em; margin-bottom: -.1em; }
.l > span { display: block; }
em { font-style: italic; }
.satin { background: linear-gradient(105deg, #6d1129 0%, #a8304d 18%, #f0c9cf 30%, #9c2440 42%, #6d1129 56%, #c66a7d 72%, #7b1530 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: satin 10s ease-in-out infinite alternate; }
.satin-ivory { background: linear-gradient(105deg, #e9ddd4 0%, #fffaf6 20%, #cbb6ae 36%, #f6eee7 52%, #d9c4bc 70%, #fffaf6 86%, #e9ddd4 100%);

  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain .9s steps(5) infinite; }

/* opening: watercolor washes bloom on velvet, the name bleeds in like pigment (drawn in WebGL over the invisible

.pre { position: fixed; inset: 0; z-index: 100; background: var(--black); display: grid; place-items: center; overflow: hidden; }

.pre-name { font-family: var(--f-text); font-weight: 300; font-size: clamp(40px, 7.6vw, 128px); line-height: 1.1; letter-spacing: .16em; margin-right: -.16em; text-transform: uppercase; white-space: nowrap; color: transparent; }
.pre.no-gl .pre-name { color: var(--ivory); }

/* nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 80; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 22px; color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.35); }

/* section scaffolding */

.kicker { color: var(--dim); display: flex; align-items: center; gap: 14px; }
.kicker::before { content: ""; width: 28px; height: 1px; background: var(--rose); }
.h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 4.2vw, 68px); line-height: 1; letter-spacing: -0.02em; }

/* about */
.about { padding-block: clamp(96px, 12vw, 180px) clamp(72px, 8vw, 120px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 32px; align-items: start; }
.about > .kicker { padding-top: .9em; }
.about-body { display: grid; gap: clamp(40px, 5vw, 72px); }
.manifesto { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 2.7vw, 44px); line-height: 1.3; letter-spacing: -0.01em; max-width: 30em; text-wrap: pretty; }

/* principles */

.no-motion .pr { width: auto; padding-right: 0; }

.w-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px 26px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 8px; }
.tab { background: none; border: 0; padding: 4px 0; cursor: pointer; position: relative; color: var(--dim); font-weight: 500; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; transition: color .4s; }

.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -15px; height: 1px; background: var(--ivory); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); }

.work:hover::after { transform: scaleX(1); transform-origin: left; }
.w-list:hover .work { opacity: .35; }
.w-list:hover .work:hover { opacity: 1; }
.work .yr { color: var(--dim); }

  .work { grid-template-columns: minmax(0, 1fr); }
  .work .thumb { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; height: auto; object-fit: cover; margin-bottom: 10px; }
  .w-list:hover .work { opacity: 1; }
}
.w-empty { padding-block: 56px 40px; display: grid; gap: 10px; justify-items: start; }
.w-empty p { margin: 0; font-family: var(--f-display); font-style: italic; font-size: clamp(22px, 2.2vw, 34px); color: var(--blush); }
.w-empty .sc { color: var(--dim); }

.w-empty button:hover { border-color: var(--blush); }
.preview { position: fixed; left: 0; top: 0; z-index: 60; width: min(22vw, 320px); aspect-ratio: 4 / 5; pointer-events: none; overflow: hidden;
  clip-path: inset(50% 50% 50% 50%); transition: clip-path .7s var(--ease); box-shadow: 0 30px 70px -20px rgba(0,0,0,.8); }

/* contact */
.contact { border-top: 1px solid var(--line); padding-block: clamp(110px, 12vw, 190px) 0;
  background: radial-gradient(ellipse 70% 45% at 50% 100%, rgba(123,21,48,.32), transparent 70%), var(--black); }

  font-weight: 500; font-size: 12.5px; letter-spacing: .24em; text-transform: uppercase;
  background: linear-gradient(180deg, rgba(255,240,242,.13), rgba(255,240,242,.03) 55%, rgba(196,107,124,.08));
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);

.mail { font-family: var(--f-display); font-size: clamp(22px, 2.6vw, 40px); line-height: 1.1; word-break: break-all; user-select: all; }
.copied { color: var(--blush); min-height: 1.4em; margin-top: 6px; font-style: italic; font-size: 16px; }

.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px 32px; margin-top: clamp(80px, 9vw, 140px); border-top: 1px solid var(--line); padding-top: 20px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-family: var(--f-display); font-size: 15px; color: var(--dim); }
.foot a:hover { color: var(--ivory); }

.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.bars i { width: 2px; height: 100%; background: currentColor; transform-origin: bottom; transform: scaleY(.3); transition: transform .8s var(--ease); }

.sound { position: fixed; z-index: 96; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid rgba(244,237,230,.16); border-radius: 999px; padding: 9px 14px; color: #fff; cursor: pointer; background: rgba(21,10,13,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-family: var(--f-text); font-weight: 500; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; transition: border-color .6s var(--ease); }
.sound:hover { border-color: rgba(244,237,230,.42); }

/* editor (owner only) */
.edit-fab { position: fixed; z-index: 96; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); border: 1px solid rgba(234,210,203,.25); border-radius: 999px; padding: 11px 18px; cursor: pointer;
  background: rgba(21,10,13,.85); backdrop-filter: blur(8px); font-weight: 600; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }

.editor { position: fixed; z-index: 97; top: 0; right: 0; bottom: 0; width: min(460px, 100%); overflow-y: auto; background: #120809; border-left: 1px solid var(--line); box-shadow: -30px 0 80px rgba(0,0,0,.6);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) 22px; display: grid; align-content: start; gap: 18px; font-size: 17px; }
.ed-head { display: flex; justify-content: space-between; align-items: center; }
.ed-head h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }

.ed-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; }

.ed-items .acts button, .ed-btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 14px; }
.ed-items .acts button:hover, .ed-btn:hover { border-color: var(--blush); }

      .to(cnt, { v: 100, duration: 3.7, ease: 'sine.inOut', onUpdate: () => pc.textContent = String(Math.round(cnt.v)).padStart(3, '0') }, .4)
      .to('.pre-sub', { opacity: 1, filter: 'blur(0px)', y: 0, duration: 1.8, ease: 'sine.out' }, 2.1)
      .to(pw, { sheen: 1, duration: 1.9, ease: 'sine.inOut' }, 3)
      .to('.pre-sub, .pre-count', { opacity: 0, filter: 'blur(10px)', duration: 1.3, ease: 'sine.in' }, 4.25)
      .to('.pre-dust', { opacity: 0, duration: 1.4, ease: 'sine.inOut' }, 4.4)
      .to(pw, { out: 1, duration: 2, ease: 'sine.inOut' }, 4.45)
      .add(heroIn(), 4.9);
    if (!preGL) { gsap.set(pre, { clipPath: 'inset(0% 0% 0% 0%)' }); tl.to(pre, { clipPath: 'inset(50% 0% 50% 0%)', duration: 1.5, ease: 'sine.inOut' }, 4.6); }
    setTimeout(() => { if (pre.isConnected) tl.progress(1); }, 11500);
  }

  /* hero recedes */
  gsap.to('.hero-copy', { yPercent: -18, opacity: .2, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: 1.2 } });

  /* reveals */
  gsap.utils.toArray('[data-lines]').forEach(h => gsap.from(h.querySelectorAll('.l > span'), { yPercent: 110, duration: 1.4, stagger: .09, ease: 'expo.out', scrollTrigger: { trigger: h, start: 'top 86%' } }));
  gsap.utils.toArray('main [data-fade]').forEach(e => gsap.from(e, { opacity: 0, y: 22, duration: 1.2, ease: 'power3.out', scrollTrigger: { trigger: e, start: 'top 92%' } }));
  gsap.from('.path li', { opacity: 0, x: -12, duration: 1, stagger: .12, ease: 'power3.out', scrollTrigger: { trigger: '.path', start: 'top 90%' } });

  const man = $('#manifesto'), words = [];
  (function split(node) {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) {
        const frag = document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) frag.appendChild(document.createTextNode(w)); else { const s = el('span', null, w); words.push(s); frag.appendChild(s); } });
        node.replaceChild(frag, ch);
      } else split(ch);
    });
  })(man);
  gsap.fromTo(words, { opacity: .14 }, { opacity: 1, stagger: .1, ease: 'none', scrollTrigger: { trigger: man, start: 'top 80%', end: 'bottom 52%', scrub: 1 } });

  $$('[data-to]').forEach(b => {
    const to = +b.dataset.to, pad = +(b.dataset.pad || 0), suf = b.dataset.suffix || '', comma = !!b.dataset.comma, o = { v: 0 };
    const show = () => { const n = Math.round(o.v); let s = comma ? n.toLocaleString('en-US') : String(n); if (pad) s = s.padStart(pad, '0'); b.textContent = s + (n === to ? suf : ''); };
    gsap.to(o, { v: to, duration: 2.2, ease: 'power3.out', onUpdate: show, scrollTrigger: { trigger: b, start: 'top 92%' } });
  });

  const mm = gsap.matchMedia();
  mm.add('(min-width: 761px)', () => {
    const track = $('#prTrack'), dist = () => Math.max(0, track.scrollWidth - innerWidth);
    gsap.to(track, { x: () => -dist(), ease: 'none', scrollTrigger: { trigger: '#prPin', start: 'top top', end: () => '+=' + dist(), pin: true, scrub: 1.4, invalidateOnRefresh: true } });
  });
  mm.add('(max-width: 760px)', () => {
    gsap.utils.toArray('.pr').forEach(p => gsap.from(p, { y: 36, opacity: 0, duration: 1.2, ease: 'power3.out', scrollTrigger: { trigger: p, start: 'top 90%' } }));
  });

  addEventListener('load', () => ScrollTrigger.refresh());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
})();
</script>

</body></html>
